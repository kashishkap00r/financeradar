<!doctype html>
<!-- Share-preview image (og:image) for financeradar.news, 1200x630.

       google-chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1200,630 --virtual-time-budget=4000 \
         --screenshot="$PWD/og-image.png" "file://$PWD/scripts/og-image.html"
